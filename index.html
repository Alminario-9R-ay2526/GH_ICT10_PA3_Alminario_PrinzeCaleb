<!DOCTYPE html>
 <html lang="en">
 <head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with Dictionary</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap");

        :root {
          --night: #241a4d;
          --night-deep: #170f33;
          --magenta: #ff3d81;
          --cyan: #2de2e6;
          --yellow: #ffd23f;
          --yellow-shade: #c9971a;
          --paper: #fff6dc;
          --ink: #170f33;

          --pixel: "Press Start 2P", "Courier New", monospace;
          --term: "VT323", "Courier New", monospace;
        }

        * {
          box-sizing: border-box;
        }

        html {
          background: var(--night-deep);
        }

        body {
          margin: 0;
          min-height: 100vh;
          padding: 48px 20px 64px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 32px;
          color: var(--paper);
          font-family: var(--term);
          font-size: 26px;
          line-height: 1.25;
          background-color: var(--night);
          background-image:
            repeating-linear-gradient(
              to bottom,
              rgba(0, 0, 0, 0.18) 0,
              rgba(0, 0, 0, 0.18) 2px,
              transparent 2px,
              transparent 4px
            ),
            linear-gradient(rgba(45, 226, 230, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(45, 226, 230, 0.06) 1px, transparent 1px);
          background-size: auto, 32px 32px, 32px 32px;
        }

        py-script {
          display: none;
        }

        /* ---------- Title ---------- */

        h2 {
          margin: 0;
          max-width: 640px;
          font-family: var(--pixel);
          font-weight: 400;
          font-size: clamp(18px, 4.2vw, 30px);
          line-height: 1.6;
          text-align: center;
          color: var(--yellow);
          text-shadow:
            3px 3px 0 var(--magenta),
            6px 6px 0 var(--night-deep);
        }

        /* ---------- Form panel ---------- */

        form {
          width: 100%;
          max-width: 520px;
          padding: 28px 24px 32px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 22px;
          background: var(--night-deep);
          border: 4px solid var(--cyan);
          box-shadow:
            8px 8px 0 var(--magenta),
            inset 0 0 0 4px var(--night);
        }

        form br {
          display: none;
        }

        /* ---------- Text input ---------- */

        input[type="text"] {
          width: 100%;
          padding: 14px 16px;
          font-family: var(--term);
          font-size: 30px;
          color: var(--cyan);
          background: #0d0820;
          border: 4px solid var(--paper);
          border-radius: 0;
          caret-color: var(--yellow);
          outline: none;
        }

        input[type="text"]::placeholder {
          color: rgba(255, 246, 220, 0.45);
        }

        input[type="text"]:focus {
          border-color: var(--yellow);
          box-shadow: 0 0 0 4px var(--night-deep), 0 0 0 8px var(--yellow);
        }

        /* ---------- Search button ---------- */

        input[type="button"] {
          align-self: center;
          padding: 16px 28px 14px;
          font-family: var(--pixel);
          font-size: 16px;
          color: var(--ink);
          background: var(--yellow);
          border: 4px solid var(--ink);
          border-radius: 0;
          box-shadow: 0 6px 0 var(--yellow-shade), 0 6px 0 4px var(--ink);
          cursor: pointer;
          transition: transform 0.05s steps(2), box-shadow 0.05s steps(2);
        }

        input[type="button"]:hover {
          background: #ffe27a;
        }

        input[type="button"]:active {
          transform: translateY(6px);
          box-shadow: 0 0 0 var(--yellow-shade), 0 0 0 4px var(--ink);
        }

        input[type="button"]:focus-visible {
          outline: 4px solid var(--cyan);
          outline-offset: 6px;
        }

        /* ---------- Result: RPG-style dialog box ---------- */

        #result {
          width: 100%;
          max-width: 520px;
          padding: 22px 24px;
          font-size: 30px;
          line-height: 1.3;
          color: var(--paper);
          background: var(--night-deep);
          border: 4px solid var(--paper);
          box-shadow:
            8px 8px 0 var(--cyan),
            inset 0 0 0 4px var(--night);
          overflow-wrap: anywhere;
        }

        #result:empty {
          display: none;
        }

        #result::after {
          content: "\25BC";
          display: block;
          margin-top: 10px;
          text-align: right;
          font-size: 20px;
          color: var(--magenta);
          animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
          50% {
            opacity: 0;
          }
        }

        /* ---------- Small screens & motion preferences ---------- */

        @media (max-width: 480px) {
          body {
            padding: 32px 14px 48px;
            font-size: 24px;
          }

          form {
            padding: 22px 16px 26px;
            box-shadow: 6px 6px 0 var(--magenta), inset 0 0 0 4px var(--night);
          }

          input[type="text"] {
            font-size: 26px;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          #result::after {
            animation: none;
          }

          input[type="button"] {
            transition: none;
          }
        }
    </style>
 </head>
 <body>
    <h2>Know the Creator of your Favorite Game</h2>
    <form>
        <input type="text" id="dictionary" placeholder="Enter your favorite game"><br>
        <input type="button" py-click="game_details" value="Search">
    </form>
    <div id="result"></div>
    <py-script src="main.py"></py-script>
 </body>
 </html>
